<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7e9e6"/>
      <stop offset="45%" stop-color="#f2e2ea"/>
      <stop offset="100%" stop-color="#e6e6f2"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe0d0"/>
      <stop offset="100%" stop-color="#b9d2bd"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a9c9a8"/>
      <stop offset="100%" stop-color="#8fb894"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fae86"/>
      <stop offset="100%" stop-color="#5f9469"/>
    </linearGradient>
    <linearGradient id="meadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ea277"/>
      <stop offset="100%" stop-color="#4f8560"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="620" fill="url(#sky)"/>

  <!-- Distant mountains -->
  <path d="M0 300 L180 190 L330 280 L470 170 L640 300 L820 200 L980 300 L1160 190 L1330 290 L1470 210 L1600 300 L1600 620 L0 620 Z"
        fill="url(#hillFar)" opacity="0.75"/>

  <!-- Mid hills -->
  <path d="M0 380 C 220 300, 420 430, 640 370 C 860 310, 1060 430, 1280 370 C 1420 330, 1520 380, 1600 360 L1600 620 L0 620 Z"
        fill="url(#hillMid)"/>

  <!-- Near hills -->
  <path d="M0 470 C 260 400, 520 520, 800 460 C 1080 400, 1340 520, 1600 450 L1600 620 L0 620 Z"
        fill="url(#hillNear)"/>

  <!-- Meadow foreground -->
  <path d="M0 560 C 300 510, 700 590, 1000 550 C 1250 518, 1450 570, 1600 545 L1600 620 L0 620 Z"
        fill="url(#meadow)"/>

  <!-- Small house -->
  <g transform="translate(300 430)">
    <rect x="0" y="26" width="86" height="56" fill="#f3efe6"/>
    <path d="M-10 28 L43 -8 L96 28 Z" fill="#8a7f74"/>
    <rect x="34" y="50" width="20" height="32" fill="#6f6459"/>
    <rect x="12" y="40" width="16" height="16" fill="#c9d6e0"/>
    <rect x="60" y="40" width="16" height="16" fill="#c9d6e0"/>
  </g>

  <!-- Trees -->
  <g fill="#4f8560">
    <g transform="translate(560 400)">
      <rect x="14" y="40" width="8" height="34" fill="#6b5a4a"/>
      <circle cx="18" cy="30" r="30"/>
      <circle cx="-6" cy="44" r="22"/>
      <circle cx="42" cy="44" r="22"/>
    </g>
    <g transform="translate(1180 380)">
      <rect x="16" y="46" width="9" height="40" fill="#6b5a4a"/>
      <circle cx="20" cy="34" r="34"/>
      <circle cx="-8" cy="50" r="24"/>
      <circle cx="48" cy="50" r="24"/>
    </g>
    <g transform="translate(1420 420)">
      <rect x="12" y="36" width="7" height="30" fill="#6b5a4a"/>
      <circle cx="15" cy="26" r="26"/>
      <circle cx="-6" cy="40" r="18"/>
      <circle cx="36" cy="40" r="18"/>
    </g>
  </g>

  <!-- Flower field -->
  <g opacity="0.9">
    <g fill="#e8a0b8">
      <circle cx="120" cy="560" r="5"/><circle cx="200" cy="585" r="4"/>
      <circle cx="330" cy="575" r="5"/><circle cx="470" cy="595" r="4"/>
      <circle cx="620" cy="570" r="5"/><circle cx="760" cy="592" r="4"/>
      <circle cx="900" cy="572" r="5"/><circle cx="1050" cy="590" r="4"/>
      <circle cx="1200" cy="568" r="5"/><circle cx="1350" cy="588" r="4"/>
      <circle cx="1480" cy="572" r="5"/>
    </g>
    <g fill="#f0c98a">
      <circle cx="160" cy="590" r="4"/><circle cx="270" cy="562" r="5"/>
      <circle cx="400" cy="588" r="4"/><circle cx="540" cy="568" r="5"/>
      <circle cx="690" cy="590" r="4"/><circle cx="830" cy="566" r="5"/>
      <circle cx="980" cy="588" r="4"/><circle cx="1130" cy="566" r="5"/>
      <circle cx="1280" cy="590" r="4"/><circle cx="1430" cy="566" r="5"/>
    </g>
    <g fill="#b7a6e0">
      <circle cx="240" cy="600" r="4"/><circle cx="360" cy="556" r="4"/>
      <circle cx="500" cy="600" r="4"/><circle cx="650" cy="556" r="4"/>
      <circle cx="800" cy="600" r="4"/><circle cx="950" cy="556" r="4"/>
      <circle cx="1100" cy="600" r="4"/><circle cx="1250" cy="556" r="4"/>
      <circle cx="1400" cy="600" r="4"/>
    </g>
  </g>
</svg>
