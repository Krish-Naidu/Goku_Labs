<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2440"/>
      <stop offset="35%" stop-color="#4a3a5c"/>
      <stop offset="62%" stop-color="#8a5f74"/>
      <stop offset="82%" stop-color="#c98a86"/>
      <stop offset="100%" stop-color="#e8b48f"/>
    </linearGradient>

    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe6c2" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#f7c48f" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f7c48f" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d5a52"/>
      <stop offset="100%" stop-color="#2f4a44"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f5248"/>
      <stop offset="100%" stop-color="#24413a"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#24463c"/>
      <stop offset="100%" stop-color="#1a352e"/>
    </linearGradient>
    <linearGradient id="meadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3d33"/>
      <stop offset="100%" stop-color="#122820"/>
    </linearGradient>

    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8b48f" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e8b48f" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Sun glow -->
  <circle cx="1120" cy="470" r="320" fill="url(#sun)"/>
  <circle cx="1120" cy="470" r="70" fill="#ffe9c8" opacity="0.85"/>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="180" cy="90" r="1.6"/><circle cx="340" cy="150" r="1.2"/>
    <circle cx="520" cy="70" r="1.8"/><circle cx="700" cy="130" r="1.3"/>
    <circle cx="880" cy="60" r="1.5"/><circle cx="1050" cy="120" r="1.2"/>
    <circle cx="1240" cy="80" r="1.7"/><circle cx="1420" cy="140" r="1.3"/>
    <circle cx="260" cy="220" r="1.1"/><circle cx="620" cy="240" r="1.2"/>
    <circle cx="960" cy="210" r="1.1"/><circle cx="1340" cy="230" r="1.2"/>
  </g>

  <!-- Distant mountains -->
  <path d="M0 470 L170 350 L320 440 L470 320 L640 450 L820 340 L980 450 L1160 330 L1330 440 L1470 350 L1600 450 L1600 900 L0 900 Z"
        fill="url(#hillFar)" opacity="0.85"/>

  <!-- Mist band -->
  <rect x="0" y="430" width="1600" height="120" fill="url(#mist)"/>

  <!-- Mid hills -->
  <path d="M0 560 C 220 470, 430 610, 650 540 C 870 470, 1070 610, 1290 540 C 1430 495, 1520 550, 1600 525 L1600 900 L0 900 Z"
        fill="url(#hillMid)"/>

  <!-- Near hills -->
  <path d="M0 660 C 260 580, 520 720, 800 650 C 1080 580, 1340 720, 1600 640 L1600 900 L0 900 Z"
        fill="url(#hillNear)"/>

  <!-- Meadow foreground -->
  <path d="M0 780 C 300 720, 700 820, 1000 770 C 1250 730, 1450 800, 1600 765 L1600 900 L0 900 Z"
        fill="url(#meadow)"/>

  <!-- Small house -->
  <g transform="translate(300 600)">
    <rect x="0" y="30" width="96" height="62" fill="#e9e2d4"/>
    <path d="M-12 32 L48 -10 L108 32 Z" fill="#6b5f56"/>
    <rect x="38" y="56" width="22" height="36" fill="#4a4038"/>
    <rect x="14" y="46" width="18" height="18" fill="#f2c98a"/>
    <rect x="66" y="46" width="18" height="18" fill="#f2c98a"/>
  </g>

  <!-- Trees -->
  <g>
    <g transform="translate(560 560)">
      <rect x="16" y="46" width="9" height="40" fill="#3a2f28"/>
      <circle cx="20" cy="34" r="34" fill="#2c4f42"/>
      <circle cx="-8" cy="50" r="24" fill="#26463b"/>
      <circle cx="48" cy="50" r="24" fill="#26463b"/>
    </g>
    <g transform="translate(1180 540)">
      <rect x="18" y="52" width="10" height="46" fill="#3a2f28"/>
      <circle cx="23" cy="38" r="38" fill="#2c4f42"/>
      <circle cx="-9" cy="56" r="26" fill="#26463b"/>
      <circle cx="55" cy="56" r="26" fill="#26463b"/>
    </g>
    <g transform="translate(1420 590)">
      <rect x="13" y="40" width="8" height="34" fill="#3a2f28"/>
      <circle cx="17" cy="28" r="28" fill="#2c4f42"/>
      <circle cx="-7" cy="44" r="19" fill="#26463b"/>
      <circle cx="41" cy="44" r="19" fill="#26463b"/>
    </g>
    <g transform="translate(880 600)">
      <rect x="11" y="34" width="7" height="28" fill="#3a2f28"/>
      <circle cx="14" cy="24" r="23" fill="#2c4f42"/>
      <circle cx="-6" cy="38" r="16" fill="#26463b"/>
      <circle cx="34" cy="38" r="16" fill="#26463b"/>
    </g>
  </g>

  <!-- Flower field -->
  <g opacity="0.95">
    <g fill="#e8a0b8">
      <circle cx="120" cy="800" r="5"/><circle cx="210" cy="835" r="4"/>
      <circle cx="340" cy="820" r="5"/><circle cx="480" cy="850" r="4"/>
      <circle cx="630" cy="815" r="5"/><circle cx="770" cy="845" r="4"/>
      <circle cx="910" cy="818" r="5"/><circle cx="1060" cy="848" r="4"/>
      <circle cx="1210" cy="812" r="5"/><circle cx="1360" cy="842" r="4"/>
      <circle cx="1490" cy="820" r="5"/>
    </g>
    <g fill="#f0c98a">
      <circle cx="160" cy="845" r="4"/><circle cx="280" cy="808" r="5"/>
      <circle cx="410" cy="842" r="4"/><circle cx="550" cy="812" r="5"/>
      <circle cx="700" cy="845" r="4"/><circle cx="840" cy="810" r="5"/>
      <circle cx="990" cy="842" r="4"/><circle cx="1140" cy="810" r="5"/>
      <circle cx="1290" cy="845" r="4"/><circle cx="1440" cy="810" r="5"/>
    </g>
    <g fill="#b7a6e0">
      <circle cx="250" cy="862" r="4"/><circle cx="370" cy="800" r="4"/>
      <circle cx="510" cy="862" r="4"/><circle cx="660" cy="800" r="4"/>
      <circle cx="810" cy="862" r="4"/><circle cx="960" cy="800" r="4"/>
      <circle cx="1110" cy="862" r="4"/><circle cx="1260" cy="800" r="4"/>
      <circle cx="1410" cy="862" r="4"/>
    </g>
  </g>
</svg>
